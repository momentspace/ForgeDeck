name: Personal signed APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore private signing key
        env:
          FORGEDECK_KEYSTORE_BASE64: ${{ secrets.FORGEDECK_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import os,base64,pathlib
          value=os.environ.get("FORGEDECK_KEYSTORE_BASE64", "")
          if not value:
              raise SystemExit("Signing secrets are required. See docs/INSTALL.md.")
          target=pathlib.Path(os.environ["RUNNER_TEMP"])/"forgedeck-release.jks"
          target.write_bytes(base64.b64decode(value,validate=True))
          target.chmod(0o600)
          PY
      - name: Build personal signed release
        env:
          FORGEDECK_KEYSTORE_PATH: ${{ runner.temp }}/forgedeck-release.jks
          FORGEDECK_STORE_PASSWORD: ${{ secrets.FORGEDECK_STORE_PASSWORD }}
          FORGEDECK_KEY_ALIAS: ${{ secrets.FORGEDECK_KEY_ALIAS }}
          FORGEDECK_KEY_PASSWORD: ${{ secrets.FORGEDECK_KEY_PASSWORD }}
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeDeck-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/forgedeck-release.jks"
